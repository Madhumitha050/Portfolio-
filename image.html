<!DOCTYPE html>
<html>
<head>
<title>Double Click Example</title>
</head>
<body>
<h2>Double-click the image to toggle its size</h2>
<img id="pic" src="D:\Priya\me.jpeg" alt="sample">

<script>
const pic = document.getElementById("pic");
let large =true;

pic.addEventListener("dblclick", function() {
  if (large) {
    pic.style.width = "150px";
  } else {
    pic.style.width = "300px";
  }
  large = !large;
});
</script>
</body>
</html>
